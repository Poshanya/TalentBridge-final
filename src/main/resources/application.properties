spring.application.name=Talent-Bridge

# Local development defaults are intentionally limited to the database address/user.
# Supply DB_PASSWORD and JWT_SECRET through environment variables; never commit secrets.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/talentbridge?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# For first deployment, DDL_AUTO=update can create/update tables. After schema is stable,
# switch to validate and use a migration tool for future schema changes.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.port=${PORT:8080}
